<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thi trắc nghiệm trực tuyến</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <div class="brand">📝 Thi trắc nghiệm</div>
    <nav class="nav">
      <a href="#/rooms" data-nav="rooms">Phòng thi</a>
      <a href="#/practice" data-nav="practice">Luyện tập</a>
      <a href="#/history" data-nav="history">Lịch sử</a>
    </nav>
    <div class="user">
      <span id="user-name"></span>
      <button class="btn btn-ghost btn-sm" id="btn-logout">Đăng xuất</button>
    </div>
  </header>

  <div class="mock-banner" id="mock-banner" hidden>
    Đang dùng dữ liệu mẫu (mock). Tài khoản thử (mật khẩu 123456): <b>minh</b> (học sinh) · <b>giaovien</b> (cô giáo)
  </div>

  <main id="app" class="container"></main>

  <div id="toast" class="toast" hidden></div>

  <!-- Thu tu nap: mock -> api -> chart -> app -->
  <script src="js/mock-server.js"></script>
  <script src="js/api.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
